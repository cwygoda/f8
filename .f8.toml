contentDir = "content"
outputDir = ".f8"
cacheDir = ".f8/cache"

[image]
widths = [480, 768, 1024, 1440, 1920, 2560]
formats = ["avif", "webp", "jpeg"]
allowUpscale = false
linearResize = true
interpolation = "mks"

[image.quality]
avif = 72
webp = 82
jpeg = 88

[gallery]
layout = "masonry"
gap = "clamp(0.75rem, 2vw, 1.5rem)"
maxColumns = 4

[viewer]
enableMap = true
enableMapZoom = true
showMapAttribution = false
enableMapMarkerLink = true
enableExifOverlay = true
mapStyleUrl = "https://tiles.openfreemap.org/styles/liberty"
mapMarkerUrlTemplate = "https://earth.google.com/web/@{lat},{lng},1000a,1000d,35y,0h,60t,0r"

[privacy]
includeGpsMetadata = true
includeExifMetadata = true
stripOutputMetadata = true

[security]
allowUnprocessedImages = false
sanitizeMarkdown = true
